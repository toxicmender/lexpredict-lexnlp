[project]
name = "lexpredict-lexnlp"
version = "2.3.1"
description = "LexNLP by LexPredict. It is a library for working with real, unstructured legal text, including contracts, plans, policies, procedures, and other material."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "coverage>=7.13.1",
    "dateparser>=1.2.2",
    "elasticsearch>=9.2.1",
    "gensim>=4.4.0",
    "joblib>=1.5.3",
    "lxml>=6.0.2",
    "nltk>=3.9.2",
    "nose>=1.3.7",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
    "psutil>=7.2.1",
    "pycountry>=24.6.1",
    "pytest>=9.0.2",
    "regex>=2025.11.3",
    "reporters-db>=3.2.63",
    "requests>=2.32.5",
    "ruff>=0.14.10",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "spacy>=3.8.11",
    "sphinx>=9.1.0",
    "twine>=6.2.0",
    "unidecode>=1.4.0",
    "zahlwort2num>=0.4.2",
]
